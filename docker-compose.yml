services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: harborsync-rabbitmq
    ports:
      - "15673:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-vessel:
    image: postgres:15
    container_name: vessel-db
    environment:
      POSTGRES_DB: ${VESSEL_DB:-vessel_db}
      POSTGRES_USER: ${POSTGRES_USER:-harbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harbor123}
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harbor} -d ${VESSEL_DB:-vessel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-task:
    image: postgres:15
    container_name: task-db
    environment:
      POSTGRES_DB: ${TASK_DB:-task_db}
      POSTGRES_USER: ${POSTGRES_USER:-harbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harbor123}
    ports:
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harbor} -d ${TASK_DB:-task_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: harborsync-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  vessel-service:
    build: ./vessel-service
    container_name: vessel-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      postgres-vessel:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://vessel-db:5432/${VESSEL_DB:-vessel_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-harbor}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-harbor123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}

  telemetry-service:
    build: ./telemetry-service
    container_name: telemetry-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 8082
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: harborsync.exchange
      TELEMETRY_PROCESSED_QUEUE: telemetry.processed
      DLQ_QUEUE: dlq.errors
      DRONE_STATE_TTL_SECONDS: 30

  congestion-analysis:
    build: ./congestion-analysis
    container_name: congestion-analysis
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}

  task-assignment-service:
    build: ./task-assignment-service
    container_name: task-assignment-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      postgres-task:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://task-db:5432/${TASK_DB:-task_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-harbor}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-harbor123}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
      VESSEL_SERVICE_URL: http://vessel-service:8081

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: harborsync.exchange
      CONGESTION_ALERT_QUEUE: congestion.alert.notification
      CONGESTION_ALERT_ROUTING_KEY: congestion.alert
      TASK_CREATED_QUEUE: task.created
      TASK_FAILED_QUEUE: task.failed
      VESSEL_ARRIVED_QUEUE: vessel.arrived
      VESSEL_DOCKED_QUEUE: vessel.docked
      VESSEL_DEPARTED_QUEUE: vessel.departed
      DLQ_QUEUE: dlq.errors

  gateway:
    build: ./gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      vessel-service:
        condition: service_started
      task-assignment-service:
        condition: service_started
    environment:
      VESSEL_SERVICE_URL: http://vessel-service:8081
      TASK_SERVICE_URL: http://task-assignment-service:8084
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      HARBORSYNC_JWT_SECRET: ${HARBORSYNC_JWT_SECRET:-harborsync-demo-jwt-secret}
