server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        - id: vessel-service
          uri: ${VESSEL_SERVICE_URL:http://vessel-service:8081}
          predicates:
            - Path=/api/vessels/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@remoteAddressKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: task-assignment-service
          uri: ${TASK_SERVICE_URL:http://task-assignment-service:8084}
          predicates:
            - Path=/api/tasks/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@remoteAddressKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

harborsync:
  api-key: ${HARBORSYNC_API_KEY:harborsync-secret-key}

logging:
  pattern:
    console: "[%d{HH:mm:ss}] [%-5level] %logger{36} - %msg%n"
