global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend kubernetes_api
    bind *:8443
    default_backend kubernetes_control_plane

backend kubernetes_control_plane
    mode tcp
    balance roundrobin
    option tcp-check
    default-server inter 3s fall 3 rise 2
    server master1 192.168.10.136:6443 check
    server master2 192.168.10.137:6443 check
    server master3 192.168.10.138:6443 check

frontend harborsync_http
    bind *:80
    mode tcp
    default_backend harborsync_http_nodes

backend harborsync_http_nodes
    mode tcp
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 3 rise 2
    server worker1 192.168.10.139:30080 check
    server worker2 192.168.10.140:30080 check
    server worker3 192.168.10.141:30080 check

frontend harborsync_https
    bind *:443
    mode tcp
    default_backend harborsync_https_nodes

backend harborsync_https_nodes
    mode tcp
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 3 rise 2
    server worker1 192.168.10.139:30443 check
    server worker2 192.168.10.140:30443 check
    server worker3 192.168.10.141:30443 check
