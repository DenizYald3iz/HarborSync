# HarborSync HA control-plane bootstrap (ORNEK / EXAMPLE)
#
# Bu dosya 3 master + 3 worker'li HA cluster'in "kubeadm init" konfigurasyonudur.
# Gercek ortam degerleri (IP, hostname) sanitize edilmistir; kendi ortaminiza gore
# asagidaki degerleri degistirin:
#   - advertiseAddress   : bu komutu calistirdiginiz master'in KENDI IP'si
#   - controlPlaneEndpoint: HAProxy/Keepalived VIP:port (bkz. infra/haproxy, infra/keepalived)
#   - certSANs / node isimleri: kendi master IP ve hostname'leriniz
#
# Ilk master'da:
#   sudo kubeadm init --config kubeadm-init.yaml --upload-certs
# Diger master'lar ve worker'lar init ciktisindaki `kubeadm join ...` komutuyla katilir.
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
dryRun: false
localAPIEndpoint:
  advertiseAddress: 192.168.10.136   # <-- init'i calistirdiginiz master'in kendi IP'si
  bindPort: 6443
nodeRegistration:
  name: k8s-master1                  # <-- bu node'un hostname'i
  criSocket: unix:///run/containerd/containerd.sock
  imagePullPolicy: IfNotPresent
  imagePullSerial: true
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
clusterName: harborsync-demo
kubernetesVersion: v1.36.2
controlPlaneEndpoint: 192.168.10.150:8443   # <-- Keepalived VIP + HAProxy frontend portu
imageRepository: registry.k8s.io
networking:
  dnsDomain: cluster.local
  podSubnet: 172.30.0.0/16     # Calico ile eslesmeli (calico custom-resources.yaml)
  serviceSubnet: 10.96.0.0/12
apiServer:
  certSANs:
    - 192.168.10.150   # VIP
    - 192.168.10.136   # master1
    - 192.168.10.137   # master2
    - 192.168.10.138   # master3
    - k8s-master1
    - k8s-master2
    - k8s-master3
etcd:
  local:
    dataDir: /var/lib/etcd
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
failSwapOn: true
rotateCertificates: true
