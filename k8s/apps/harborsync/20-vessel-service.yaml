apiVersion: apps/v1
kind: Deployment
metadata:
  name: vessel-service
  namespace: harborsync
  labels:
    app.kubernetes.io/name: vessel-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: harborsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vessel-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vessel-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: harborsync
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              until nc -z vessel-db 5432; do
                echo "waiting for vessel-db:5432"
                sleep 2
              done
              until nc -z rabbitmq 5672; do
                echo "waiting for rabbitmq:5672"
                sleep 2
              done
      containers:
        - name: vessel-service
          image: harborsync/vessel-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://vessel-db:5432/vessel_db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: harborsync-runtime
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harborsync-runtime
                  key: POSTGRES_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: harborsync-runtime
                  key: RABBITMQ_DEFAULT_USER
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harborsync-runtime
                  key: RABBITMQ_DEFAULT_PASS
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vessel-service
  namespace: harborsync
  labels:
    app.kubernetes.io/name: vessel-service
    app.kubernetes.io/part-of: harborsync
spec:
  selector:
    app.kubernetes.io/name: vessel-service
  ports:
    - name: http
      port: 8081
      targetPort: http
