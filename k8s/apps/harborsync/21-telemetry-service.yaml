apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-service
  namespace: harborsync
  labels:
    app.kubernetes.io/name: telemetry-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: harborsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: harborsync
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              until nc -z redis 6379; do
                echo "waiting for redis:6379"
                sleep 2
              done
              until nc -z rabbitmq 5672; do
                echo "waiting for rabbitmq:5672"
                sleep 2
              done
      containers:
        - name: telemetry-service
          image: harborsync/telemetry-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: REDIS_ADDR
              value: redis:6379
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: harborsync-runtime
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: harborsync-runtime
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@rabbitmq:5672/
            - name: RABBITMQ_EXCHANGE
              value: harborsync.exchange
            - name: TELEMETRY_PROCESSED_QUEUE
              value: telemetry.processed
            - name: DLQ_QUEUE
              value: dlq.errors
            - name: DRONE_STATE_TTL_SECONDS
              value: "30"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-service
  namespace: harborsync
  labels:
    app.kubernetes.io/name: telemetry-service
    app.kubernetes.io/part-of: harborsync
spec:
  selector:
    app.kubernetes.io/name: telemetry-service
  ports:
    - name: http
      port: 8082
      targetPort: http
