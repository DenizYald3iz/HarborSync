apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: harborsync
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: harborsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: harborsync
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              until nc -z rabbitmq 5672; do
                echo "waiting for rabbitmq:5672"
                sleep 2
              done
      containers:
        - name: notification-service
          image: harborsync/notification-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: harborsync-runtime
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: harborsync-runtime
                  key: RABBITMQ_DEFAULT_PASS
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@rabbitmq:5672/
            - name: RABBITMQ_EXCHANGE
              value: harborsync.exchange
            - name: CONGESTION_ALERT_QUEUE
              value: congestion.alert.notification
            - name: CONGESTION_ALERT_ROUTING_KEY
              value: congestion.alert
            - name: TASK_CREATED_QUEUE
              value: task.created
            - name: TASK_FAILED_QUEUE
              value: task.failed
            - name: VESSEL_ARRIVED_QUEUE
              value: vessel.arrived
            - name: VESSEL_DOCKED_QUEUE
              value: vessel.docked
            - name: VESSEL_DEPARTED_QUEUE
              value: vessel.departed
            - name: DLQ_QUEUE
              value: dlq.errors
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: harborsync
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: harborsync
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 8085
      targetPort: http
