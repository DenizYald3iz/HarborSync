apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: harborsync
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: edge-api
    app.kubernetes.io/part-of: harborsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: edge-api
        app.kubernetes.io/part-of: harborsync
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              until nc -z redis 6379; do
                echo "waiting for redis:6379"
                sleep 2
              done
              until nc -z vessel-service 8081; do
                echo "waiting for vessel-service:8081"
                sleep 2
              done
              until nc -z task-assignment-service 8084; do
                echo "waiting for task-assignment-service:8084"
                sleep 2
              done
      containers:
        - name: gateway
          image: harborsync/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VESSEL_SERVICE_URL
              value: http://vessel-service:8081
            - name: TASK_SERVICE_URL
              value: http://task-assignment-service:8084
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: HARBORSYNC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: harborsync-runtime
                  key: HARBORSYNC_JWT_SECRET
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: harborsync
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: harborsync
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
