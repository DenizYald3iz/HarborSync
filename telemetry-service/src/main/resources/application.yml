server:
  port: 8082

spring:
  application:
    name: telemetry-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

harborsync:
  redis:
    drone-state-ttl-seconds: ${DRONE_STATE_TTL_SECONDS:30}
  rabbitmq:
    exchange: harborsync.exchange
    queues:
      telemetry-processed: telemetry.processed
      dlq: dlq.errors

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "[%d{HH:mm:ss}] [%-5level] [%X{correlationId}] %logger{36} - %msg%n"
