server:
  port: 8081

spring:
  application:
    name: vessel-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15433/vessel_db}
    username: ${SPRING_DATASOURCE_USERNAME:harbor}
    password: ${SPRING_DATASOURCE_PASSWORD:harbor123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

harborsync:
  rabbitmq:
    exchange: harborsync.exchange

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "[%d{HH:mm:ss}] [%-5level] [%X{correlationId}] %logger{36} - %msg%n"
